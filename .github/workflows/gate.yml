name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-gate:
    name: 离线门禁（语法 + 路径 + 5 自检）
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pytest

      - name: 门禁
        run: python tools/check_gate.py
