[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hd2-proxy-toolkit"
version = "0.4.1a1"
description = "Helldivers 2 local MITM proxy toolkit: GUI for client-side Status / inventory rewriting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "deepseekv41flash" }]
keywords = ["helldivers2", "mitm", "proxy", "gui"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
hd2proxy = "hd2proxy.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
